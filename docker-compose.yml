version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: task-management-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=sa_Password123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  backend:
    build:
      context: .
      dockerfile: TaskManagement.API/Dockerfile
    container_name: task-management-api
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=TaskManagementDb;User Id=sa;Password=sa_Password123!;TrustServerCertificate=True;
      - FileStorage__UploadPath=/app/Uploads
    volumes:
      - file-uploads:/app/Uploads

  frontend:
    build:
      context: ./TaskManagementUI
      dockerfile: Dockerfile
    container_name: task-management-ui
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mssql-data:
    driver: local
  file-uploads:
    driver: local
